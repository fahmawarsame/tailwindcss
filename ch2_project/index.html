
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <!-- Profile Card -->
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 text-center shadow-xl">

        <!-- Profile Image -->
        <img
            src="https://placehold.co/120x120/7c3aed/ffffff?text=ME"
            alt="My profile"
            class="mx-auto h-28 w-28 rounded-full border-4 border-purple-100"
        >

        <!-- Name -->
        <h1 class="mt-5 text-3xl font-bold text-slate-800">
            Asiya Rose
        </h1>

        <!-- Job Title -->
        <p class="mt-2 font-medium text-purple-600">
            Junior Web Developer
        </p>

        <!-- Description -->
        <p class="mt-4 leading-7 text-slate-600">
            I am learning HTML and Tailwind CSS.
            My goal is to build beautiful and responsive websites.
        </p>

        <!-- Skills -->
        <div class="mt-5 flex flex-wrap justify-center gap-2">
            <span class="rounded-full bg-purple-100 px-3 py-1 text-sm text-purple-700">
                HTML
            </span>

            <span class="rounded-full bg-blue-100 px-3 py-1 text-sm text-blue-700">
                Tailwind CSS
            </span>

            <span class="rounded-full bg-green-100 px-3 py-1 text-sm text-green-700">
                Learning
            </span>
        </div>

        <!-- Button -->
        <a
            href="https://github.com/"
            class="mt-7 inline-block rounded-lg bg-purple-600 px-6 py-3 font-semibold text-white transition hover:bg-purple-800"
        >
            Visit My GitHub
        </a>

    </div>

</body>
</html>
